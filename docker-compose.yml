services:
  # Optional local Postgres for future use — not started by default.
  # Enable with: docker compose --profile local-db up
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-lini}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lini}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      # Pin the in-container port regardless of PORT in server/.env (used for local non-Docker dev),
      # so it always matches the Dockerfile's EXPOSE/HEALTHCHECK and the ports mapping below.
      PORT: 5000
      # Set SEED_DB=true in the root .env to auto-seed test data (categories, products,
      # an admin user, a customer user) on every container start. Off by default so this
      # never runs against a real database by accident. The seed is idempotent (upserts).
      SEED_DB: ${SEED_DB:-false}
    ports:
      # Host port 5050 avoids the well-known macOS AirPlay Receiver conflict on port 5000.
      # The container itself still listens on 5000 (matches PORT above and the healthcheck).
      - "5050:5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "8080:80"
    depends_on:
      - server

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "8081:80"
    depends_on:
      - server

  # Self-hosted observability stack — not started by default.
  # Enable with: docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:2.9.8
    profiles: ["observability"]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    profiles: ["observability"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

volumes:
  pg_data:
  prometheus_data:
  grafana_data:
  loki_data:
