name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  client-lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm run lint
      - working-directory: client
        run: npx tsc -b --noEmit
      - working-directory: client
        run: npm run build

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm test

  server-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run lint
      - working-directory: server
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db
      - working-directory: server
        run: npm run typecheck

  server-test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db
      - working-directory: server
        run: npm run test:unit

  server-test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lini
          POSTGRES_PASSWORD: lini
          POSTGRES_DB: lini_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lini"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://lini:lini@localhost:5432/lini_test
      - working-directory: server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://lini:lini@localhost:5432/lini_test
      - working-directory: server
        run: npm run test:integration

  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db
      - working-directory: server
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./server
      - run: docker build ./client
